name: Release

# Push a tag like v0.2.0 to build and publish a release with:
#   - Fluent-Menu_<version>_x64-setup.exe     (NSIS installer)
#   - Fluent-Menu_<version>_x64-portable.exe  (single exe, no install)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Build installer
        run: pnpm tauri build

      # The product name has a space, so name the assets ourselves instead of
      # letting GitHub turn "Fluent Menu_..." into "Fluent.Menu_...".
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $setup = "Fluent-Menu_${version}_x64-setup.exe"
          $portable = "Fluent-Menu_${version}_x64-portable.exe"
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName $setup
          Copy-Item src-tauri/target/release/fluent-menu.exe $portable
          $notes = @"
          **Installer:** ``$setup`` installs for the current user (no admin needed) with a Start menu entry and uninstaller.

          **Portable:** ``$portable`` runs from anywhere, no install. Needs the WebView2 runtime, which Windows 11 already includes.
          "@
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $portable --clobber
          } else {
            gh release create $tag $setup $portable --title "Fluent Menu $tag" --notes $notes
          }
